<style>
  #spark-rook-demo {
    --paper: #f6f1e8;
    --ink: #2d2431;
    --plum: #3d2a4d;
    --button: #4e3563;
    --ivory: #fff5dd;
    position: relative;
    width: min(100%, 420px);
    aspect-ratio: 9 / 19.5;
    margin: 0 auto;
    overflow: hidden;
    border-radius: 30px;
    color: var(--ink);
    background:
      radial-gradient(circle at 30% 18%, rgba(255,255,255,.52), transparent 32%),
      var(--paper);
    box-shadow: 0 18px 65px rgba(45,36,49,.14);
    font-family: Arial, Helvetica, sans-serif;
    color-scheme: light;
  }

  #spark-rook-demo * { box-sizing: border-box; }
  #spark-rook-demo button { font: inherit; -webkit-tap-highlight-color: transparent; }
  #spark-rook-demo button:focus-visible { outline: 3px solid #9a7abb; outline-offset: 4px; }

  .sp-status {
    position: absolute;
    z-index: 10;
    inset: 22px 36px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 16px;
    color: #2a1649;
  }

  .sp-status-icons { display: flex; align-items: center; gap: 8px; }
  .sp-status-icons b { font-size: 12px; letter-spacing: -1px; }
  .sp-battery { width: 24px; height: 12px; border: 2px solid #2a1649; border-radius: 4px; position: relative; }
  .sp-battery::after { content: ""; position: absolute; inset: 2px; border-radius: 1px; background: #2a1649; }

  .sp-arch {
    position: absolute;
    z-index: 1;
    top: 8.6%;
    left: 7%;
    width: 86%;
    height: 46.7%;
    overflow: hidden;
    border: 13px solid var(--plum);
    border-bottom-width: 16px;
    border-radius: 46% 46% 1px 1px / 38% 38% 1px 1px;
    background: linear-gradient(180deg, #8e82bd 0%, #c7a9bd 47%, #f0d3ae 100%);
    opacity: 0;
    transform: translateY(8px);
    animation: sp-arch-in .85s .08s cubic-bezier(.2,.75,.25,1) forwards;
  }

  .sp-window-light {
    position: absolute;
    z-index: 1;
    inset: 0;
    opacity: 0;
    background:
      linear-gradient(102deg, transparent 0 66%, rgba(255,227,179,.42) 66% 75%, transparent 75%),
      linear-gradient(102deg, transparent 0 78%, rgba(255,233,194,.48) 78% 88%, transparent 88%);
    animation:
      sp-light-in 1.25s .55s ease forwards,
      sp-light-drift 14s 1.8s ease-in-out infinite alternate;
  }

  .sp-ledge {
    position: absolute;
    z-index: 4;
    left: -2%;
    right: -2%;
    bottom: -2px;
    height: 22px;
    background: linear-gradient(180deg, #554061, #3b2949);
  }

  .sp-rook {
    position: absolute;
    z-index: 3;
    left: 10%;
    bottom: 9px;
    width: 67%;
    padding: 0;
    border: 0;
    background: transparent;
    transform-origin: 51% 94%;
    opacity: 0;
    transform: translateY(12px) scale(.985);
    animation:
      sp-rook-in 1s .48s cubic-bezier(.2,.8,.25,1) forwards,
      sp-breathe 5s 1.55s ease-in-out infinite;
  }

  .sp-rook img { display: block; width: 100%; height: auto; pointer-events: none; }

  .sp-eyelid {
    position: absolute;
    z-index: 5;
    display: block;
    opacity: 0;
    background: linear-gradient(150deg, #69418f 10%, #563170 85%);
    border-bottom: 2px solid rgba(45,27,57,.55);

  .sp-eye-left {

  .sp-eye-right {

    border-radius: 49% 52% 48% 50%;

  .sp-rook.is-blinking .sp-eyelid { animation: sp-blink .18s ease-in-out; }
  .sp-rook.is-curious { animation: sp-curious 1.25s cubic-bezier(.35,.05,.2,1); }
  .sp-rook.is-responding { animation: sp-response .58s cubic-bezier(.2,.75,.25,1); }

  #spark-rook-demo h1 {
    position: absolute;
    z-index: 2;
    top: 56.1%;
    left: 8.5%;
    margin: 0;
    color: var(--ink);
    font-size: clamp(46px, 13.5vw, 62px);
    font-weight: 400;
    line-height: .92;
    letter-spacing: -2.8px;
    opacity: 0;

  #spark-rook-demo h1 em {
    font-family: Georgia, 'Times New Roman', serif;

    font-style: normal;

  .sp-cta {

    border: 0;
    border-radius: 14px;
    background: var(--button);
    box-shadow: 0 5px 0 #382542;

  @keyframes sp-arch-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes sp-light-in { to { opacity: 1; } }

  @keyframes sp-rook-in { to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes sp-copy-in { to { opacity: 1; transform: translateY(0); } }
  @keyframes sp-breathe {

    48% { transform: translateY(-1px) scaleX(1.004) scaleY(1.009); }
    60% { transform: translateY(-1px) scaleX(1.004) scaleY(1.009); }

  @keyframes sp-blink {

    42%, 62% { opacity: 1; transform: scaleY(1); }

    38%, 67% { transform: translateY(1px) rotate(-2deg); }
  }
  @keyframes sp-response {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    38% { transform: translateY(4px) rotate(1deg) scale(.992, 1.012); }
    72% { transform: translateY(-1px) rotate(-.5deg) scale(1.003, .997); }

  @media (prefers-reduced-motion: reduce) {

    .sp-eyelid { display: none; }
  }
</style>

<script>
  (() => {
    const root = document.getElementById('spark-rook-demo');
    const rook = root.querySelector('.sp-rook');
    const cta = root.querySelector('.sp-cta');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let blinkTimer;

    function blink() {
      rook.classList.remove('is-blinking');
      void rook.offsetWidth;
      rook.classList.add('is-blinking');
      window.setTimeout(() => rook.classList.remove('is-blinking'), 220);
    }

    function scheduleBlink() {
      if (reduced) return;
      const delay = 4200 + Math.random() * 3800;
      blinkTimer = window.setTimeout(() => {
        blink();
        if (Math.random() < .22) window.setTimeout(blink, 260);
        scheduleBlink();
      }, delay);
    }

    function curiosity() {
      if (reduced) return;
      rook.classList.remove('is-curious');
      void rook.offsetWidth;
      rook.classList.add('is-curious');
      window.setTimeout(() => rook.classList.remove('is-curious'), 1300);
    }

    function respond() {
      rook.classList.remove('is-responding');
      cta.classList.add('is-pressed');
      void rook.offsetWidth;
      rook.classList.add('is-responding');
      window.setTimeout(() => {
        rook.classList.remove('is-responding');
        cta.classList.remove('is-pressed');
      }, 620);
    }

    rook.addEventListener('click', curiosity);
    cta.addEventListener('click', respond);
    if (!reduced) {
      window.setTimeout(curiosity, 3200);
      scheduleBlink();
    }

    window.addEventListener('pagehide', () => window.clearTimeout(blinkTimer), { once: true });
  })();
</script>
